name: Export Section 2.4 DOCX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-section-2-4.yml'
      - 'downloads/第二章_2.4_韩语忠实翻译稿.docx'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: 第二章_2.4_韩语忠实翻译稿
          path: downloads/第二章_2.4_韩语忠实翻译稿.docx
          if-no-files-found: error
          retention-days: 1
