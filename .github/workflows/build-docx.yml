name: build-korean-thesis-docx

on:
  push:
    paths:
      - "generate_docx.py"
      - ".github/workflows/build-docx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install document dependencies
        run: python -m pip install --upgrade pip python-docx lxml

      - name: Generate and validate DOCX
        run: python generate_docx.py

      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: korean-section-2-2
          path: output/第二章_2.2_韩语忠实翻译稿_重新输出.docx
          if-no-files-found: error
          retention-days: 1
