name: Build verified section 2.5 Korean translation

on:
  push:
    branches:
      - main
    paths:
      - generate_2_5_docx.py
      - finalize_2_5_delivery.py
      - .github/workflows/build-section-2-5.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate DOCX source package
        run: python generate_2_5_docx.py

      - name: Finalize package and independent manifest
        run: python finalize_2_5_delivery.py

      - name: Independent archive checks
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          docx = Path('generated/section_2_5_korean_translation.docx')
          delivery = Path('generated/section_2_5_korean_translation.zip')
          verification = Path('generated/section_2_5_verification.txt')
          manifest = Path('generated/section_2_5_delivery_manifest.txt')
          for path in (docx, delivery, verification, manifest):
              assert path.is_file() and path.stat().st_size > 100
          with zipfile.ZipFile(docx) as zf:
              assert zf.testzip() is None
              assert 'word/document.xml' in zf.namelist()
              assert 'word/footnotes.xml' in zf.namelist()
          with zipfile.ZipFile(delivery) as zf:
              assert zf.testzip() is None
              assert set(zf.namelist()) == {
                  'section_2_5_korean_translation.docx',
                  'section_2_5_verification.txt',
              }
          assert 'RESULT=PASS' in verification.read_text(encoding='utf-8')
          assert 'DELIVERY_RESULT=PASS' in manifest.read_text(encoding='utf-8')
          print('INDEPENDENT_ARCHIVE_CHECK=PASS')
          PY

      - name: Upload verified deliverables as one ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: section-2-5-korean-translation-final
          path: |
            generated/section_2_5_korean_translation.docx
            generated/section_2_5_verification.txt
            generated/section_2_5_delivery_manifest.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Commit generated deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            generated/section_2_5_korean_translation.docx \
            generated/section_2_5_korean_translation.zip \
            generated/section_2_5_verification.txt \
            generated/section_2_5_delivery_manifest.txt
          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
          else
            git commit -m "Finalize verified section 2.5 Korean translation delivery"
            git push
          fi
