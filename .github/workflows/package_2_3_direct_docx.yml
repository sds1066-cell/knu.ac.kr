name: Package Korean Thesis Section 2.3 as Direct DOCX

on:
  push:
    branches:
      - main
    paths:
      - 'docx_build_2_3/**'
      - '.github/workflows/package_2_3_direct_docx.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate DOCX
        run: python docx_build_2_3/generate_2_3_docx.py

      - name: Expand validated DOCX package
        shell: bash
        run: |
          rm -rf docx-package
          mkdir -p docx-package
          unzip -q 'output/第二章_2.3_韩语忠实翻译稿.docx' -d docx-package
          test -f 'docx-package/[Content_Types].xml'
          test -f 'docx-package/word/document.xml'
          test -f 'docx-package/word/footnotes.xml'
          test -f 'docx-package/word/styles.xml'
          grep -q 'w:numStart w:val="26"' 'docx-package/word/settings.xml'
          test "$(grep -o '<w:footnoteReference ' 'docx-package/word/document.xml' | wc -l | tr -d ' ')" = '25'

      - name: Upload package entries as DOCX-compatible ZIP
        uses: actions/upload-artifact@v4
        with:
          name: section-2-3-direct-docx
          path: docx-package/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 7
